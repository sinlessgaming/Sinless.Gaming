<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinless GG - World's #1 Global Gaming, Wrestling & Football Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Bulletproof Firebase SDK, Auth & FIRESTORE GLOBAL DATABASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, OAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBDWeHQpmCVfJVXj5Dmu_ZuGmKvlq4wek",
            authDomain: "sinlessgg.firebaseapp.com",
            projectId: "sinlessgg",
            storageBucket: "sinlessgg.firebasestorage.app",
            messagingSenderId: "774543139920",
            appId: "1:774543139920:web:d5c0ca9c7c29de6bc81d55",
            measurementId: "G-6HJCPD6E5M"
        };

        let auth;
        window.db = null; // Make db globally accessible to our old script tags

        try {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            window.db = getFirestore(app); // Initialize Cloud Database
        } catch(e) {
            console.warn("Firebase init note:", e);
        }

        window.authenticGoogleLogin = async function() {
            try {
                if (!auth) throw new Error("Firebase offline mode");
                const provider = new GoogleAuthProvider();
                const result = await signInWithPopup(auth, provider);
                window.myEmail = result.user.email;
                window.myUsername = '@' + (result.user.displayName || result.user.email.split('@')[0]).replace(/\s+/g, '');
                saveAppData();
                document.getElementById('headerUserTag').innerText = window.myUsername;
                closeAccountModal();
                showToast(`🚀 Google Cloud Login Successful!`);
            } catch (error) {
                console.warn("Using cloud fallback session:", error.message);
                showToast(`Login failed. Check console.`);
            }
        };

        // --- FIRESTORE POSTS LOGIC ---
        // Expose these to the global window so HTML buttons can click them
        window.submitUniversalPost = async function() {
            let text = document.getElementById('postTextContent').value.trim();
            let cat = document.getElementById('postCategorySelect').value;
            if(!text) return;
            
            if(window.db) {
                try {
                    await addDoc(collection(window.db, "posts"), {
                        user: window.myUsername.replace('@',''),
                        verified: true,
                        game: cat,
                        caption: text,
                        likes: 0,
                        createdAt: serverTimestamp()
                    });
                    document.getElementById('postTextContent').value = '';
                    closeCreatePostModal(); 
                    showToast('🚀 Live on Global Feed!');
                } catch(e) {
                    showToast('Database Error: Check Firebase Test Mode Rules');
                    console.error("Firestore Add Error:", e);
                }
            } else {
                showToast('System Offline. Cannot post.');
            }
        };

        window.listenToPosts = function() {
            if(!window.db) return;
            const q = query(collection(window.db, "posts"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                window.fypPosts = []; // Clear local array
                snapshot.forEach((doc) => {
                    window.fypPosts.push({ id: doc.id, ...doc.data() });
                });
                
                // If database is completely empty, show a placeholder
                if(window.fypPosts.length === 0) {
                    window.fypPosts = [{ user: 'Sinless101', verified: true, game: 'SYSTEM', caption: 'Global Database Connected! You are the first here. Make a post!', likes: 100 }];
                }
                
                window.renderFypFeed(); // Re-render the UI instantly
            }, (error) => {
                console.warn("Firestore Listen Error:", error);
            });
        };
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { gg: { 950: '#02050b', 900: '#070f1e', 800: '#0f1d36', cyan: '#00f3ff', magenta: '#ff007f', orange: '#f97316' } } } }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        body { background-color: #02050b; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        .glass-panel { background: rgba(11, 22, 44, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(0, 243, 255, 0.15); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .glass-panel:hover { border-color: rgba(0, 243, 255, 0.3); box-shadow: 0 10px 30px -10px rgba(0, 243, 255, 0.2); }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }

<body class="min-h-screen flex flex-col antialiased selection:bg-cyan-500 selection:text-slate-950" onload="initApp()">

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col max-w-md w-full mx-auto p-3 space-y-3">
        
        <!-- View Navigation Tabs -->
        <div class="glass-panel p-1.5 rounded-2xl flex shadow-xl overflow-x-auto scrollbar-none">

            <button onclick="switchView('trending')" id="nav-trending" class="flex-1 py-2 px-2 text-[10px] rounded-xl text-gray-400 font-bold transition hover:text-white whitespace-nowrap"><i class="fa-solid fa-chart-line mr-0.5"></i> Trending</button>

        <!-- 1. FEED / FYP VIEW -->
        <div id="view-fyp" class="view-section flex-1 flex flex-col space-y-3 overflow-y-auto pb-4 fade-in">

                <button onclick="filterByCategory('WRESTLING', this)" class="cat-btn px-3 py-1.5 rounded-xl text-[10px] font-bold bg-gg-900 text-amber-400 border border-amber-500/30 whitespace-nowrap transition">🤼 Wrestling</button>

            <!-- THE CLOUD POSTS FEED -->

        <!-- OTHER VIEWS (Trending, Market, Squads, Chat) remain visually intact for now -->

                <span class="text-xs font-bold text-cyan-400"># global-gaming-chat</span>
            </div>

            <div class="p-3 border-t border-cyan-500/15 bg-gg-950 flex items-center space-x-2">
                <input type="text" id="chatInputMsg" placeholder="Chat in lobby..." class="flex-1 bg-gg-900 border border-cyan-500/25 rounded-xl px-3.5 py-2.5 text-xs text-white">
                <button class="px-4 py-2.5 bg-cyan-500 text-slate-950 font-black rounded-xl text-xs"><i class="fa-solid fa-paper-plane"></i></button>

    <!-- ACCOUNT MODAL -->
    <div id="accountModal" class="hidden fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-sm rounded-2xl p-5 flex flex-col space-y-4 shadow-2xl border border-cyan-500/40">
            <div class="flex items-center justify-between border-b border-cyan-500/15 pb-2">
                <h3 class="text-xs font-black text-white uppercase tracking-wider">Cloud Account Sign-In</h3>

    <!-- Create Post Modal -->
    <div id="createPostModal" class="hidden fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-sm rounded-2xl p-5 flex flex-col space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-cyan-500/15 pb-2">
                <h3 class="text-xs font-black text-white uppercase tracking-wider">Create Post</h3>
                <button onclick="closeCreatePostModal()" class="text-gray-400 text-xs font-bold">✕ Close</button>
            </div>
            <div class="space-y-3">
                <textarea id="postTextContent" rows="2" placeholder="What's happening (tag with @username or #hashtag)..." class="w-full bg-gg-900 border border-cyan-500/30 rounded-xl p-3 text-xs text-white"></textarea>
                <select id="postCategorySelect" class="w-full bg-gg-900 text-cyan-400 text-xs font-bold p-2.5 rounded-xl border border-cyan-500/30">
                    <option value="FOOTBALL">⚽ Football</option>
                    <option value="FC MOBILE">📱 FC Mobile</option>
                    <option value="EA SPORTS FC">🎮 EA Sports FC</option>
                    <option value="WRESTLING">🤼 Wrestling</option>
                </select>
                <!-- Now calls the globally exposed Cloud function -->
                <button onclick="window.submitUniversalPost()" class="w-full py-3 bg-cyan-500 text-slate-950 font-black rounded-xl text-xs">🚀 Publish to Cloud</button>
            </div>
        </div>
    </div>

    <script>
        let activeCategoryFilter = 'ALL';
        window.myUsername = localStorage.getItem('sinless_username') || '@SinlessGaming';
        window.myEmail = localStorage.getItem('sinless_email') || 'sinlessgaming@gmail.com';
        
        // This is now populated dynamically by Firebase in the module above
        window.fypPosts = []; 

        let marketListings = JSON.parse(localStorage.getItem('sinless_market')) || [{ title: 'FC Mobile 120 OVR', price: 'GH₵ 350', user: 'Sinless101' }];
        let clansData = JSON.parse(localStorage.getItem('sinless_clans')) || [{ name: 'FOOTBALL OFFICIAL SQUAD', tag: 'FTB', leader: 'Sinless101' }];

        // DYNAMIC TOP WIDGET LOGIC (SStats)
        async function fetchDynamicTopWidget() {
            const widget = document.getElementById('DynamicTopWidget');
            const header = document.getElementById('dynamicWidgetHeader');
            const body = document.getElementById('dynamicWidgetBody');
            if (!widget || !header || !body) return;

            let allMatches = [];
            try {
                const res = await fetch('https://api.sstats.net/games?status=live');
                if (res.ok) {
                    const data = await res.json();
                    allMatches = (data.games || data || []).slice(0, 10);
                }
            } catch(e) {}

            if (allMatches.length > 0) {
                widget.className = "glass-panel rounded-2xl p-4 shadow-xl border border-red-500/30 mb-4";
                header.innerHTML = `<h3 class="text-xs font-black text-white uppercase"><i class="fa-solid fa-circle text-red-500 text-[8px] animate-pulse mr-1.5"></i> Live Matches</h3>`;
                body.innerHTML = '';
                allMatches.forEach(m => {
                    const home = (m.homeTeam && m.homeTeam.name) ? m.homeTeam.name : (m.homeTeam || m.home || 'Home');
                    const away = (m.awayTeam && m.awayTeam.name) ? m.awayTeam.name : (m.awayTeam || m.away || 'Away');
                    const score = `${m.homeScore ?? m.home_score ?? 0} - ${m.awayScore ?? m.away_score ?? 0}`;
                    body.innerHTML += `
                        <div class="flex items-center justify-between bg-gg-950 rounded-xl p-2.5 border border-red-500/10">
                            <div class="flex-1 min-w-0 pr-2"><p class="text-xs font-bold text-white truncate">${home} vs ${away}</p></div>
                            <div class="text-right pl-3"><p class="text-sm font-black text-white">${score}</p></div>
                        </div>
                    `;
                });
            } else {
                widget.className = "glass-panel rounded-2xl p-4 shadow-xl border border-cyan-500/20 mb-4";
                header.innerHTML = `<h3 class="text-xs font-black text-white uppercase"><i class="fa-solid fa-fire text-amber-400 text-[10px] mr-1.5"></i> Trending Summary</h3>`;
                body.innerHTML = `
                    <div class="flex items-center justify-between bg-gg-950 rounded-xl p-2.5 border border-cyan-500/10">
                        <div><h4 class="text-xs font-black text-white">#SinlessSuperLeague</h4><p class="text-[9px] text-cyan-400">Trending in Gaming</p></div>
                    </div>
                `;
            }
            widget.style.display = (activeCategoryFilter === 'ALL') ? 'block' : 'none';
        }

        function showToast(msg) {
            let banner = document.getElementById('toastBanner');
            banner.innerText = msg;
            banner.style.opacity = '1';
            setTimeout(() => { banner.style.opacity = '0'; }, 3000);
        }

        function saveAppData() {
            localStorage.setItem('sinless_username', window.myUsername);
            localStorage.setItem('sinless_email', window.myEmail);
        }

        function initApp() {
            document.getElementById('headerUserTag').innerText = window.myUsername;
            
            // START LISTENING TO THE GLOBAL CLOUD
            if(window.listenToPosts) window.listenToPosts();

            renderMarketList();
            renderClansList();
            runTrendingTopics();
            fetchDynamicTopWidget();
            setInterval(fetchDynamicTopWidget, 60000); 
        }

        function openAccountModal() { document.getElementById('accountModal').classList.remove('hidden'); }
        function closeAccountModal() { document.getElementById('accountModal').classList.add('hidden'); }
        function openCreatePostModal() { document.getElementById('createPostModal').classList.remove('hidden'); }
        function closeCreatePostModal() { document.getElementById('createPostModal').classList.add('hidden'); }

        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.add('hidden'));
            ['fyp', 'trending', 'market', 'clans', 'chat'].forEach(v => {
                let navBtn = document.getElementById('nav-' + v);
                if(navBtn) {
                    navBtn.classList.remove('bg-magenta', 'text-white', 'font-extrabold');
                    navBtn.classList.add('text-gray-400', 'font-bold');
                }
            });
            let activeSection = document.getElementById('view-' + viewName);
            let activeNav = document.getElementById('nav-' + viewName);
            if(activeSection) activeSection.classList.remove('hidden');
            if(activeNav) {
                activeNav.classList.remove('text-gray-400', 'font-bold');
                activeNav.classList.add('bg-magenta', 'text-white', 'font-extrabold');
            }
            if(viewName === 'fyp') {
                const topWidget = document.getElementById('DynamicTopWidget');
                if (topWidget) topWidget.style.display = (activeCategoryFilter === 'ALL') ? 'block' : 'none';
            }
        }

        function filterByCategory(cat, btn) {
            activeCategoryFilter = cat;
            document.querySelectorAll('#categoryFilterBar .cat-btn').forEach(b => {
                b.className = "cat-btn px-3 py-1.5 rounded-xl text-[10px] font-bold bg-gg-900 text-gray-300 border border-cyan-500/25 whitespace-nowrap transition";
            });
            if(btn) btn.className = "cat-btn px-3 py-1.5 rounded-xl text-[10px] font-extrabold bg-cyan-400 text-slate-950 whitespace-nowrap shadow transition";
            
            const topWidget = document.getElementById('DynamicTopWidget');
            if (topWidget) topWidget.style.display = (cat === 'ALL') ? 'block' : 'none';
            
            window.renderFypFeed();
        }

        // GLOBALLY EXPOSED SO FIREBASE LISTENER CAN CALL IT
        window.renderFypFeed = function() {
            let container = document.getElementById('fypFeedContainer');
            if(!container) return;
            container.innerHTML = '';
            
            let filtered = (window.fypPosts || []).filter(p => activeCategoryFilter === 'ALL' || p.game === activeCategoryFilter);
            
            if(filtered.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-500 text-center py-4">No posts in this category yet.</p>`;
                return;
            }

            filtered.forEach(post => {
                container.innerHTML += `
                    <div class="glass-panel rounded-2xl p-3 space-y-2 shadow-xl border border-cyan-500/10">
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-xs text-white">@${post.user} <span class="verified-badge"><i class="fa-solid fa-circle-check"></i></span></span>
                            <span class="text-[9px] text-cyan-400 font-bold">${post.game || 'GAMING'}</span>
                        </div>
                        <p class="text-xs text-gray-200">${post.caption}</p>
                    </div>
                `;
            });
        };

        function renderMarketList() {
            let box = document.getElementById('marketListContainer'); if(!box) return; box.innerHTML = '';
            marketListings.forEach(item => {
                box.innerHTML += `<div class="glass-panel p-3 rounded-2xl flex justify-between items-center text-xs"><div><h4 class="font-bold text-white">${item.title}</h4><p class="text-[9px] text-gray-400">@${item.user}</p></div><span class="text-cyan-400 font-black">${item.price}</span></div>`;
            });
        }

        function renderClansList() {
            let box = document.getElementById('clansListContainer'); if(!box) return; box.innerHTML = '';
            clansData.forEach(c => {
                box.innerHTML += `<div class="glass-panel p-3 rounded-2xl flex justify-between items-center text-xs"><div><h4 class="font-bold text-white">${c.name} [${c.tag}]</h4><p class="text-[9px] text-gray-400">Leader: @${c.leader}</p></div><button onclick="showToast('Squad Lobby Coming Soon!')" class="px-3 py-1.5 bg-emerald-500 text-slate-950 rounded-xl font-black">View</button></div>`;
            });
        }

        function runTrendingTopics() {
            let list = document.getElementById('dynamicTrendingTopicsList'); if(!list) return;
            const trends = [
                { tag: '#SinlessSuperLeague', count: '4,320', cat: 'Gaming' },

            ];
            list.innerHTML = trends.map(t => `
