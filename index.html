<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinless Gaming - Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        sinless: { 950: '#0b0f19', 900: '#111827', 800: '#1f2937', cyan: '#00f3ff', magenta: '#ff007f' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="h-14 bg-sinless-900 border-b border-gray-800 flex items-center justify-between px-4 sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <div class="w-7 h-7 rounded bg-gradient-to-tr from-cyan-500 to-magenta flex items-center justify-center font-bold text-white text-xs">SG</div>
            <h1 class="font-bold text-xs tracking-wide text-white">SINLESS GAMING</h1>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="toggleAdminMode()" id="adminToggleBtn" class="px-2.5 py-1 rounded text-[11px] font-semibold bg-gray-800 text-gray-300 border border-gray-700">
                <i class="fa-solid fa-shield-halved mr-1"></i> Admin
            </button>
            <span class="text-[11px] text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20 font-medium">Live</span>
        </div>
    </header>

    <!-- Tournament Selector Bar -->
    <div class="bg-sinless-900/80 border-b border-gray-800 p-2 overflow-x-auto flex space-x-2 scrollbar-none">
        <button onclick="switchTournament('champions-league')" id="tab-champions-league" class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap bg-cyan-500 text-gray-950">Champions League</button>
        <button onclick="switchTournament('super-league')" id="tab-super-league" class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap bg-gray-800 text-gray-300">Super League</button>
        <button onclick="switchTournament('open-cup')" id="tab-open-cup" class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap bg-gray-800 text-gray-300">Open Cup</button>
        <button onclick="switchTournament('rising-stars')" id="tab-rising-stars" class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap bg-gray-800 text-gray-300">Rising Stars</button>
    </div>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col max-w-2xl w-full mx-auto p-3 space-y-3">
        
        <!-- View Toggle (Chat vs Standings) -->
        <div class="flex bg-sinless-900 p-1 rounded-xl border border-gray-800">
            <button onclick="switchView('chat')" id="btnViewChat" class="flex-1 py-1.5 text-xs rounded-lg bg-cyan-500 text-gray-950 font-bold transition">💬 Live Chat</button>
            <button onclick="switchView('standings')" id="btnViewStandings" class="flex-1 py-1.5 text-xs rounded-lg text-gray-400 font-bold transition">🏆 Standings</button>
        </div>

        <!-- Chat Container -->
        <div id="viewChat" class="flex-1 flex flex-col bg-sinless-900 rounded-2xl border border-gray-800 overflow-hidden h-[450px]">
            <div class="p-3 border-b border-gray-800 text-xs font-bold text-cyan-400 flex items-center justify-between">
                <span id="chatHeaderTitle"># champions-league chat</span>
                <span class="text-[10px] text-gray-500 font-normal">Synced</span>
            </div>
            <div id="chatMessagesBox" class="flex-1 overflow-y-auto p-3 space-y-3"></div>
            <div class="p-2.5 border-t border-gray-800 bg-sinless-950/50 flex space-x-2">
                <input type="text" id="chatInputMsg" placeholder="Type message..." class="flex-1 bg-sinless-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-400">
                <button onclick="sendChatMessage()" class="px-3.5 py-2 bg-cyan-500 text-gray-950 font-bold rounded-xl text-xs"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- Standings Container -->
        <div id="viewStandings" class="hidden flex-1 flex flex-col bg-sinless-900 rounded-2xl border border-gray-800 overflow-hidden p-3 space-y-3">
            <div class="flex items-center justify-between">
                <h3 id="standingsTitle" class="text-xs font-bold text-white uppercase tracking-wider">Champions League Standings</h3>
                <button id="addTeamBtn" onclick="addTeamModal()" class="hidden px-2.5 py-1 bg-emerald-600 text-white rounded-lg text-[11px] font-bold">+ Add Team</button>
            </div>
            <div class="overflow-x-auto flex-1">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-gray-800/40 text-gray-400 text-[10px] uppercase border-b border-gray-800">
                            <th class="p-2">Rank</th>
                            <th class="p-2">Player / Team</th>
                            <th class="p-2 text-center">P</th>
                            <th class="p-2 text-center">GD</th>
                            <th class="p-2 text-center">PTS</th>
                        </tr>
                    </thead>
                    <tbody id="standingsTableBody" class="divide-y divide-gray-800/60"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let isAdmin = false;
        let currentTourney = 'champions-league';
        let currentView = 'chat';

        const data = {
            'champions-league': {
                name: 'Champions League',
                teams: [
                    { name: 'DON PRIME (Darkdemon)', p: 3, gd: '+6', pts: 12 },
                    { name: 'MUBARAQ', p: 4, gd: '+4', pts: 8 },
                    { name: 'NONCHALANT (Cobbykay)', p: 3, gd: '+6', pts: 8 }
                ],
                messages: [{ user: 'System', text: 'Welcome to Champions League room.', time: 'Just now' }]
            },
            'super-league': {
                name: 'Super League',
                teams: [
                    { name: 'KUKU1Z', p: 2, gd: '+5', pts: 6 },
                    { name: 'MILLY SHARDS', p: 2, gd: '0', pts: 3 }
                ],
                messages: [{ user: 'System', text: 'Welcome to Super League room.', time: 'Just now' }]
            },
            'open-cup': {
                name: 'Open Cup',
                teams: [
                    { name: 'REAL HOME WISER', p: 1, gd: '+2', pts: 3 }
                ],
                messages: [{ user: 'System', text: 'Welcome to Open Cup room.', time: 'Just now' }]
            },
            'rising-stars': {
                name: 'Rising Stars',
                teams: [
                    { name: 'CHUMASI', p: 1, gd: '+3', pts: 3 }
                ],
                messages: [{ user: 'System', text: 'Welcome to Rising Stars room.', time: 'Just now' }]
            }
        };

        function switchTournament(key) {
            currentTourney = key;
            ['champions-league', 'super-league', 'open-cup', 'rising-stars'].forEach(k => {
                const btn = document.getElementById('tab-' + k);
                if(k === key) {
                    btn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap bg-cyan-500 text-gray-950 shadow-md";
                } else {
                    btn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap bg-gray-800 text-gray-300";
                }
            });
            document.getElementById('chatHeaderTitle').innerText = '#' + key + ' chat';
            document.getElementById('standingsTitle').innerText = data[key].name + ' Standings';
            renderChat();
            renderStandings();
        }

        function switchView(view) {
            currentView = view;
            const chatBtn = document.getElementById('btnViewChat');
            const standBtn = document.getElementById('btnViewStandings');
            if(view === 'chat') {
                document.getElementById('viewChat').classList.remove('hidden');
                document.getElementById('viewStandings').classList.add('hidden');
                chatBtn.className = "flex-1 py-1.5 text-xs rounded-lg bg-cyan-500 text-gray-950 font-bold transition";
                standBtn.className = "flex-1 py-1.5 text-xs rounded-lg text-gray-400 font-bold transition";
            } else {
                document.getElementById('viewChat').classList.add('hidden');
                document.getElementById('viewStandings').classList.remove('hidden');
                standBtn.className = "flex-1 py-1.5 text-xs rounded-lg bg-cyan-500 text-gray-950 font-bold transition";
                chatBtn.className = "flex-1 py-1.5 text-xs rounded-lg text-gray-400 font-bold transition";
            }
        }

        function renderChat() {
            const box = document.getElementById('chatMessagesBox');
            box.innerHTML = '';
            data[currentTourney].messages.forEach(m => {
                box.innerHTML += `
                    <div class="bg-sinless-950/60 p-2.5 rounded-xl border border-gray-800">
                        <div class="flex items-center justify-between text-[10px] text-cyan-400 font-bold mb-0.5">
                            <span>${m.user}</span>
                            <span class="text-gray-500 font-normal">${m.time}</span>
                        </div>
                        <p class="text-xs text-gray-200">${m.text}</p>
                    </div>
                `;
            });
            box.scrollTop = box.scrollHeight;
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInputMsg');
            if(!input.value.trim()) return;
            data[currentTourney].messages.push({
                user: isAdmin ? 'CEO [Admin]' : 'Manager',
                text: input.value,
                time: 'Just now'
            });
            input.value = '';
            renderChat();
        }

        function renderStandings() {
            const tbody = document.getElementById('standingsTableBody');
            tbody.innerHTML = '';
            data[currentTourney].teams.forEach((t, i) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-800/30">
                        <td class="p-2 font-bold text-cyan-400">0${i+1}</td>
                        <td class="p-2 font-semibold text-white">${t.name}</td>
                        <td class="p-2 text-center text-gray-300">${t.p}</td>
                        <td class="p-2 text-center text-cyan-300">${t.gd}</td>
                        <td class="p-2 text-center font-bold text-white">${t.pts}</td>
                    </tr>
                `;
            });
        }

        function toggleAdminMode() {
            isAdmin = !isAdmin;
            const btn = document.getElementById('adminToggleBtn');
            const addBtn = document.getElementById('addTeamBtn');
            if(isAdmin) {
                btn.className = "px-2.5 py-1 rounded text-[11px] font-semibold bg-pink-600/20 text-pink-400 border border-pink-500/40";
                btn.innerHTML = '<i class="fa-solid fa-crown mr-1"></i> Active';
                addBtn.classList.remove('hidden');
                alert('CEO God-Mode Unlocked');
            } else {
                btn.className = "px-2.5 py-1 rounded text-[11px] font-semibold bg-gray-800 text-gray-300 border border-gray-700";
                btn.innerHTML = '<i class="fa-solid fa-shield-halved mr-1"></i> Admin';
                addBtn.classList.add('hidden');
            }
        }

        function addTeamModal() {
            const name = prompt("Enter team/player name:");
            if(name) {
                data[currentTourney].teams.push({ name: name.toUpperCase(), p: 0, gd: '0', pts: 0 });
                renderStandings();
            }
        }

        switchTournament('champions-league');
    </script>
</body>
</html>
