<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithRedirect, GoogleAuthProvider, OAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBDWeHQpmCVfJVXj5Dmu_ZuGmKvlqI4wek",
        authDomain: "sinlessgg.firebaseapp.com",
        projectId: "sinlessgg",
        storageBucket: "sinlessgg.firebasestorage.app",
        messagingSenderId: "774543139920",
        appId: "1:774543139920:web:d5c0ca9c7c29de6bc81d55",
        measurementId: "G-6HJCPD6E5M"
    };

    let auth;
    try {
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
    } catch(e) {
        console.warn("Firebase init note:", e);
    }

    // Wait until the rest of the page scripts have loaded
    window.addEventListener('load', () => {
        if (!auth) return;
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.myEmail = user.email || '';
                window.myUsername = '@' + (user.displayName || (user.email ? user.email.split('@')[0] : 'Gamer')).replace(/\s+/g, '');
                if (typeof saveAppData === 'function') saveAppData();
                const headerTag = document.getElementById('headerUserTag');
                if (headerTag) headerTag.innerText = window.myUsername;
                if (typeof showToast === 'function') showToast(`🚀 Logged in as ${window.myUsername}`);
            }
        });
    });

    window.authenticGoogleLogin = async function() {
        try {
            if (!auth) throw new Error("Firebase offline mode");
            const provider = new GoogleAuthProvider();
            await signInWithRedirect(auth, provider);
        } catch (error) {
            console.error(error);
            if (typeof showToast === 'function') showToast("Login failed: " + (error.message || "Unknown error"));
        }
    };

    window.authenticAppleLogin = async function() {
        try {
            if (!auth) throw new Error("Firebase offline mode");
            const provider = new OAuthProvider('apple.com');
            await signInWithRedirect(auth, provider);
        } catch (error) {
            console.error(error);
            if (typeof showToast === 'function') showToast("Apple login failed: " + (error.message || "Unknown error"));
        }
    };
</script>
