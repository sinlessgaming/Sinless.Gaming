<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sinless GG - Global Gaming Hub</title>
    
    <!-- Tailwind CSS & Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #02050b;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            touch-action: manipulation;
        }

        .glass-panel {
            background: rgba(11, 22, 44, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 243, 255, 0.15);
        }

        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gg: { 950: '#02050b', 900: '#070f1e', 800: '#0f1d36', cyan: '#00f3ff', magenta: '#ff007f', orange: '#f97316' }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex flex-col antialiased bg-gg-950 text-white">

    <!-- Toast Notification Banner -->
    <div id="toastBanner" class="fixed top-4 left-1/2 -translate-x-1/2 z-[300] bg-cyan-500 text-slate-950 px-4 py-2.5 rounded-2xl font-black text-xs shadow-2xl transition-all duration-300 opacity-0 pointer-events-none text-center">
        Notification message
    </div>

    <!-- Side Menu Drawer -->
    <div id="sideDrawerOverlay" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-[260] transition-opacity" onclick="closeSideDrawer()">
        <div id="sideDrawerPanel" class="w-72 max-w-[80vw] h-full bg-gg-900 border-r border-cyan-500/20 p-5 flex flex-col justify-between transform -translate-x-full transition-transform duration-300 shadow-2xl" onclick="event.stopPropagation()">
            <div class="space-y-6">
                <div class="flex items-center justify-between border-b border-cyan-500/15 pb-4">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-400 to-magenta flex items-center justify-center font-black text-slate-950 text-sm shadow-lg">SG</div>
                        <div>
                            <h3 class="font-extrabold text-sm text-white">SINLESS <span class="text-cyan-400">GG</span></h3>
                            <p id="drawerUserTag" class="text-[9px] text-orange-400 font-extrabold uppercase">@SinlessGaming</p>
                        </div>
                    </div>
                    <button onclick="closeSideDrawer()" class="text-gray-400 hover:text-white text-sm font-bold">✕</button>
                </div>

                <div class="space-y-3">
                    <span class="text-[10px] font-extrabold text-gray-400 uppercase tracking-wider block">Assets & Wallet</span>
                    <div onclick="closeSideDrawer(); showToast('🪙 Wallet Balance: ' + window.myGGCoins + ' GG Coins')" class="p-3 bg-gg-950 rounded-xl border border-amber-500/30 flex items-center justify-between cursor-pointer hover:bg-amber-500/10 transition">
                        <div class="flex items-center space-x-2.5">
                            <i class="fa-solid fa-coins text-amber-400 text-sm"></i>
                            <span class="text-xs font-bold text-white">GG Coins Balance</span>
                        </div>
                        <span id="drawerCoinBalanceText" class="text-xs font-black text-amber-400">100 GG Coins</span>
                    </div>
                </div>
            </div>
            <div class="border-t border-cyan-500/15 pt-4 text-center">
                <p class="text-[9px] text-gray-500 font-semibold">Sinless GG Hub v2.5</p>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-gg-900/95 backdrop-blur-md border-b border-cyan-500/15 px-3 py-3 flex items-center justify-between sticky top-0 z-50 shadow-xl">
        <div class="flex items-center space-x-2.5 cursor-pointer group" onclick="openSideDrawer()">
            <button class="w-8 h-8 rounded-xl bg-slate-800 border border-cyan-500/30 flex items-center justify-center text-cyan-400 text-xs shadow hover:bg-slate-700 transition">
                <i class="fa-solid fa-bars text-sm"></i>
            </button>
            <h1 class="font-extrabold text-xs tracking-wide text-white group-hover:text-cyan-400 transition">SINLESS <span class="text-cyan-400">GG</span></h1>
        </div>

        <button onclick="openUniversalCreateModal()" class="px-3.5 py-1.5 rounded-xl text-xs font-extrabold bg-gradient-to-r from-magenta to-pink-600 text-white shadow hover:opacity-90 transition flex items-center space-x-1">
            <i class="fa-solid fa-plus"></i><span>Post</span>
        </button>
    </header>

    <!-- Main App Container -->
    <main class="flex-1 flex flex-col max-w-2xl w-full mx-auto p-3 space-y-3">
        <!-- Navigation Bar -->
        <div class="glass-panel p-1.5 rounded-2xl flex shadow-xl overflow-x-auto scrollbar-none">
            <button onclick="switchView('fyp')" id="nav-fyp" class="flex-1 py-2 px-3 text-[10px] rounded-xl bg-magenta text-white font-extrabold transition shadow-lg whitespace-nowrap"><i class="fa-solid fa-fire mr-1"></i> Feed</button>
            <button onclick="switchView('trending')" id="nav-trending" class="flex-1 py-2 px-3 text-[10px] rounded-xl text-gray-400 font-bold transition hover:text-white whitespace-nowrap"><i class="fa-solid fa-chart-line mr-1"></i> Trending</button>
            <button onclick="switchView('tournaments')" id="nav-tournaments" class="flex-1 py-2 px-3 text-[10px] rounded-xl text-amber-400 font-extrabold transition hover:text-white whitespace-nowrap"><i class="fa-solid fa-trophy mr-1"></i> Tournaments</button>
            <button onclick="switchView('clans')" id="nav-clans" class="flex-1 py-2 px-3 text-[10px] rounded-xl text-gray-400 font-bold transition hover:text-white whitespace-nowrap"><i class="fa-solid fa-shield-halved mr-1"></i> Squads</button>
            <button onclick="switchView('chat')" id="nav-chat" class="flex-1 py-2 px-3 text-[10px] rounded-xl text-gray-400 font-bold transition hover:text-white whitespace-nowrap"><i class="fa-solid fa-comments mr-1"></i> Lobbies</button>
        </div>

        <!-- Feed Section -->
        <div id="view-fyp" class="view-section flex-1 flex flex-col space-y-3">
            <div id="fypFeedContainer" class="space-y-4"></div>
        </div>

        <!-- Trending Section -->
        <div id="view-trending" class="view-section hidden flex-1 flex flex-col space-y-4">
            <div class="glass-panel p-4 rounded-2xl space-y-3 shadow-xl border border-cyan-500/30">
                <h3 class="text-xs font-black text-white uppercase tracking-wider"><i class="fa-solid fa-hashtag text-cyan-400 mr-1.5"></i> Trending Hashtags</h3>
                <div id="dynamicTrendingTopicsList" class="space-y-2.5"></div>
            </div>
        </div>

        <!-- Tournaments Section -->
        <div id="view-tournaments" class="view-section hidden flex-1 flex flex-col space-y-4">
            <div id="tournamentsDedicatedContainer" class="space-y-3"></div>
        </div>

        <!-- Squads Section -->
        <div id="view-clans" class="view-section hidden flex-1 flex flex-col space-y-4">
            <div id="clansContainer" class="space-y-3"></div>
        </div>

        <!-- Lobbies Section -->
        <div id="view-chat" class="view-section hidden flex-1 flex flex-col space-y-4">
            <div id="chatLobbiesContainer" class="space-y-3"></div>
        </div>
    </main>

    <!-- Create Post Modal -->
    <div id="universalCreateModal" class="hidden fixed inset-0 bg-slate-950/85 backdrop-blur-md z-[160] flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-xs rounded-2xl p-4 flex flex-col space-y-3 text-center border border-cyan-500/40">
            <div class="flex items-center justify-between border-b border-cyan-500/15 pb-2">
                <h3 class="text-xs font-black text-white uppercase tracking-wider">Create Hub</h3>
                <button onclick="closeUniversalCreateModal()" class="text-gray-400 hover:text-white text-xs font-bold">✕</button>
            </div>
            <textarea id="postCaptionInput" rows="3" placeholder="What's happening in your game?" class="w-full p-2.5 bg-gg-950 border border-cyan-500/20 rounded-xl text-xs text-white focus:outline-none focus:border-cyan-400"></textarea>
            <button onclick="submitNewPost()" class="w-full py-2 bg-magenta text-white font-extrabold rounded-xl text-xs shadow">Publish Post</button>
        </div>
    </div>

    <!-- Self-Contained JavaScript Logic -->
    <script>
        window.myGGCoins = parseInt(localStorage.getItem('sinless_gg_coins') || '100');

        window.showToast = function(msg) {
            const banner = document.getElementById('toastBanner');
            if (!banner) return;
            banner.innerText = msg;
            banner.style.opacity = '1';
            banner.style.pointerEvents = 'auto';
            setTimeout(() => {
                banner.style.opacity = '0';
                banner.style.pointerEvents = 'none';
            }, 3000);
        };

        window.openSideDrawer = function() {
            document.getElementById('sideDrawerOverlay')?.classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('sideDrawerPanel')?.classList.remove('-translate-x-full');
            }, 10);
        };

        window.closeSideDrawer = function() {
            document.getElementById('sideDrawerPanel')?.classList.add('-translate-x-full');
            setTimeout(() => {
                document.getElementById('sideDrawerOverlay')?.classList.add('hidden');
            }, 300);
        };

        window.fypposts = [
            { id: '1', user: 'SinlessGaming', game: 'FC MOBILE', caption: '🏆 SINLESS SUPER LEAGUE SEASON 8 IS LIVE!' },
            { id: '2', user: 'AceKhyd', game: 'EA SPORTS FC', caption: 'Who is ready for the tournament this weekend?' }
        ];

        window.renderFeed = function() {
            const container = document.getElementById('fypFeedContainer');
            if (!container) return;
            container.innerHTML = window.fypposts.map(p => `
                <div class="glass-panel p-4 rounded-2xl space-y-2 border border-cyan-500/20">
                    <div class="flex justify-between items-center">
                        <span class="font-extrabold text-xs text-white">@${p.user}</span>
                        <span class="text-[9px] text-cyan-400 font-bold">${p.game}</span>
                    </div>
                    <p class="text-xs text-gray-200">${p.caption}</p>
                </div>
            `).join('');
        };

        window.renderTrending = function() {
            const container = document.getElementById('dynamicTrendingTopicsList');
            if (!container) return;
            container.innerHTML = `
                <div class="glass-panel p-3 bg-gg-900 rounded-xl flex justify-between">
                    <h4 class="text-xs font-bold text-white">#SinlessSuperLeague</h4>
                    <span class="text-[9px] text-cyan-400">4,320 posts</span>
                </div>`;
        };

        window.renderTournaments = function() {
            const container = document.getElementById('tournamentsDedicatedContainer');
            if (!container) return;
            container.innerHTML = `
                <div class="glass-panel p-4 rounded-2xl border border-cyan-500/20 space-y-1">
                    <h3 class="font-black text-white text-sm">SINLESS SUPER LEAGUE - SEASON 8</h3>
                    <p class="text-[10px] text-cyan-400">Game: EA SPORTS FC MOBILE • Prize: 10,000 GG Coins</p>
                </div>`;
        };

        window.renderSquads = function() {
            const container = document.getElementById('clansContainer');
            if (!container) return;
            container.innerHTML = `
                <div class="glass-panel p-4 rounded-2xl border border-cyan-500/20">
                    <h3 class="font-black text-white text-sm">Sinless Esports Elite</h3>
                    <p class="text-[10px] text-gray-400">Official Accra tournament competitive squad.</p>
                </div>`;
        };

        window.renderLobbies = function() {
            const container = document.getElementById('chatLobbiesContainer');
            if (!container) return;
            container.innerHTML = `
                <div class="glass-panel p-4 rounded-2xl border border-cyan-500/20">
                    <h3 class="font-black text-white text-sm">Global Matchmaking Lobby</h3>
                    <p class="text-[10px] text-cyan-400">Challenge local players live.</p>
                </div>`;
        };

        window.switchView = function(viewName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));

            const target = document.getElementById(`view-${viewName}`);
            if (target) target.classList.remove('hidden');

            ['fyp', 'trending', 'tournaments', 'clans', 'chat'].forEach(name => {
                const btn = document.getElementById(`nav-${name}`);
                if (btn) {
                    btn.className = (name === viewName)
                        ? 'flex-1 py-2 px-3 text-[10px] rounded-xl bg-magenta text-white font-extrabold transition shadow-lg whitespace-nowrap'
                        : 'flex-1 py-2 px-3 text-[10px] rounded-xl text-gray-400 font-bold transition hover:text-white whitespace-nowrap';
                }
            });

            if (viewName === 'trending') window.renderTrending();
            if (viewName === 'tournaments') window.renderTournaments();
            if (viewName === 'clans') window.renderSquads();
            if (viewName === 'chat') window.renderLobbies();
        };

        window.openUniversalCreateModal = () => document.getElementById('universalCreateModal')?.classList.remove('hidden');
        window.closeUniversalCreateModal = () => document.getElementById('universalCreateModal')?.classList.add('hidden');

        window.submitNewPost = function() {
            const input = document.getElementById('postCaptionInput');
            const caption = input ? input.value.trim() : '';
            if (!caption) return window.showToast('⚠️ Please write something first!');

            window.fypposts.unshift({ id: Date.now().toString(), user: 'AceKhyd', game: 'FC MOBILE', caption });
            input.value = '';
            window.closeUniversalCreateModal();
            window.renderFeed();
            window.showToast('🚀 Post published!');
        };

        document.addEventListener('DOMContentLoaded', () => {
            window.renderFeed();
        });
    </script>
</body>
</html>
