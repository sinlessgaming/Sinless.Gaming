<!-- Firebase SDK Setup -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, OAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  // Paste your config keys here
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "sinlessgg.firebaseapp.com",
    projectId: "sinlessgg",
    storageBucket: "sinlessgg.firebasestorage.app",
    messagingSenderId: "774543139920",
    appId: "1:774543139920:web:d5c0ca9c7c29..."
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.authenticGoogleLogin = async () => {
      try {
          const provider = new GoogleAuthProvider();
          const result = await signInWithPopup(auth, provider);
          myEmail = result.user.email;
          myUsername = '@' + result.user.displayName.replace(/\s+/g, '');
          saveAppData();
          document.getElementById('headerUserTag').innerText = myUsername;
          closeAccountModal();
          alert(`🚀 Google Cloud Login Successful!\nEmail: ${myEmail}`);
      } catch (error) {
          alert("Login error: " + error.message);
      }
  };

  window.authenticAppleLogin = async () => {
      try {
          const provider = new OAuthProvider('apple.com');
          const result = await signInWithPopup(auth, provider);
          myEmail = result.user.email || 'apple_user@privaterelay.appleid.com';
          myUsername = '@AppleGamer';
          saveAppData();
          document.getElementById('headerUserTag').innerText = myUsername;
          closeAccountModal();
          alert(`🍏 Apple ID Login Successful!\nEmail: ${myEmail}`);
      } catch (error) {
          alert("Login error: " + error.message);
      }
  };
</script>
