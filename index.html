
<!-- SINLESS GG: additive feature registry -->
<script>
(() => {
  const GGFeatures = {
    config: {
      challenges: true,
      predictions: false,
      clanWars: false
    },

    isEnabled(name) {
      return this.config[name] === true;
    },

    register(name, init) {
      if (!this.isEnabled(name)) {
        console.info(`[Sinless GG] ${name} is disabled`);
        return;
      }

      if (typeof init !== "function") {
        throw new TypeError("Feature initializer must be a function");
      }

      init();
    }
  };

  // Expose a namespaced API without replacing existing app logic.
  window.GGFeatures = GGFeatures;

  // Add new feature initializers here as they are implemented.
})();
</script>
