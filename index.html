<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinless GG - World's #1 Global Gaming, Wrestling & Football Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gg: { 950: '#02050b', 900: '#070f1e', 800: '#0f1d36', cyan: '#00f3ff', magenta: '#ff007f', orange: '#f97316' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #02050b; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        .glass-panel { background: rgba(11, 22, 44, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(0, 243, 255, 0.15); transition: all 0.3s ease; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .verified-badge { color: #f97316; text-shadow: 0 0 10px rgba(249, 115, 22, 0.5); }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-cyan-500 selection:text-slate-950" onload="initApp()">

    <!-- Mobile Header -->
    <header class="bg-gg-900/95 backdrop-blur-md border-b border-cyan-500/15 px-3 py-3 flex items-center justify-between sticky top-0 z-50 shadow-xl">
        <div class="flex items-center space-x-2.5 cursor-pointer" onclick="switchView('fyp')">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-cyan-400 to-magenta flex items-center justify-center font-black text-slate-950 text-xs shadow-lg">SG</div>
            <div>
                <h1 class="font-extrabold text-xs tracking-wide text-white">SINLESS <span class="text-cyan-400">GG</span></h1>
                <p id="headerUserTag" class="text-[7.5px] text-orange-400 tracking-wider uppercase font-extrabold">@SinlessGaming</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openAccountModal()" class="w-8 h-8 rounded-xl bg-gg-800 border border-cyan-500/30 flex items-center justify-center text-cyan-400 text-xs shadow" title="Account / Login">
                <i class="fa-solid fa-user"></i>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col max-w-md w-full mx-auto p-3 space-y-3">
        
        <!-- View Tabs -->
        <div class="glass-panel p-1.5 rounded-2xl flex shadow-xl overflow-x-auto scrollbar-none">
            <button onclick="switchView('fyp')" id="nav-fyp" class="flex-1 py-2 px-3 text-[10px] rounded-xl bg-magenta text-white font-extrabold transition shadow-lg whitespace-nowrap"><i class="fa-solid fa-fire mr-1"></i> Feed</button>
            <button onclick="switchView('trending')" id="nav-trending" class="flex-1 py-2 px-3 text-[10px] rounded-xl text-gray-400 font-bold transition whitespace-nowrap"><i class="fa-solid fa-chart-line mr-1"></i> Trending</button>
            <button onclick="switchView('market')" id="nav-market" class="flex-1 py-2 px-3 text-[10px] rounded-xl text-gray-400 font-bold transition whitespace-nowrap"><i class="fa-solid fa-store mr-1"></i> Market</button>
        </div>

        <!-- Feed View -->
        <div id="view-fyp" class="view-section flex-1 flex flex-col space-y-3 overflow-y-auto pb-4 fade-in">
            <!-- Restored Category Filters Bar -->
            <div id="categoryFilterBar" class="flex space-x-2 overflow-x-auto scrollbar-none py-1">
                <button onclick="filterByCategory('ALL', this)" class="cat-btn px-3 py-1.5 rounded-xl text-[10px] font-extrabold bg-cyan-400 text-slate-950 whitespace-nowrap shadow transition">🌐 All</button>
                <button onclick="filterByCategory('FOOTBALL', this)" class="cat-btn px-3 py-1.5 rounded-xl text-[10px] font-bold bg-gg-900 text-emerald-400 border border-emerald-500/20 whitespace-nowrap transition">⚽ Football</button>
                <button onclick="filterByCategory('FC MOBILE', this)" class="cat-btn px-3 py-1.5 rounded-xl text-[10px] font-bold bg-gg-900 text-cyan-300 border border-cyan-500/20 whitespace-nowrap transition">📱 FC Mobile</button>
                <button onclick="filterByCategory('EA SPORTS FC', this)" class="cat-btn px-3 py-1.5 rounded-xl text-[10px] font-bold bg-gg-900 text-magenta border border-magenta/30 whitespace-nowrap transition">🎮 EA Sports FC</button>
                <button onclick="filterByCategory('EFOOTBALL', this)" class="cat-btn px-3 py-1.5 rounded-xl text-[10px] font-bold bg-gg-900 text-cyan-300 border border-cyan-500/20 whitespace-nowrap transition">⚡ eFootball</button>
                <button onclick="filterByCategory('WRESTLING', this)" class="cat-btn px-3 py-1.5 rounded-xl text-[10px] font-bold bg-gg-900 text-amber-400 border border-amber-500/30 whitespace-nowrap transition">🤼 Wrestling</button>
            </div>

            <div id="fypFeedContainer" class="space-y-3"></div>
        </div>

        <!-- Trending View -->
        <div id="view-trending" class="view-section hidden flex-1 flex flex-col space-y-3 overflow-y-auto pb-4 fade-in">
            <div class="glass-panel p-4 rounded-2xl space-y-2">
                <h3 class="text-xs font-black text-cyan-400 uppercase">🔥 Trending Topics</h3>
                <p class="text-xs text-gray-300">#SinlessSuperLeague is trending with 4,320 posts.</p>
            </div>
        </div>

        <!-- Market View -->
        <div id="view-market" class="view-section hidden flex-1 flex flex-col space-y-3 overflow-y-auto pb-4 fade-in">
            <div class="glass-panel p-4 rounded-2xl space-y-2">
                <h3 class="text-xs font-black text-cyan-400 uppercase">🛒 GG Market</h3>
                <p class="text-xs text-gray-300">Browse secure game accounts and player trades.</p>
            </div>
        </div>
    </main>

    <!-- Account Modal -->
    <div id="accountModal" class="hidden fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-sm rounded-2xl p-5 flex flex-col space-y-4 shadow-2xl border border-cyan-500/40">
            <div class="flex items-center justify-between border-b border-cyan-500/15 pb-2">
                <h3 class="text-xs font-black text-white uppercase tracking-wider">Account Sign-In</h3>
                <button onclick="closeAccountModal()" class="text-gray-400 hover:text-white text-xs font-bold">✕ Close</button>
            </div>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-[10px] text-cyan-400 font-bold mb-1">Your Email Address</label>
                    <input type="email" id="setupEmailInput" placeholder="yourname@gmail.com" class="w-full bg-gg-900 border border-cyan-500/30 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-[10px] text-cyan-400 font-bold mb-1">Your Gamer Tag</label>
                    <input type="text" id="setupUsernameInput" placeholder="@YourGamerTag" class="w-full bg-gg-900 border border-cyan-500/30 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none">
                </div>
                <button onclick="saveUserAccount()" class="w-full py-3 bg-cyan-500 text-slate-950 font-black rounded-xl text-xs shadow-lg">💾 Save Account & Sync</button>
            </div>
        </div>
    </div>

    <script>
        let activeCategoryFilter = 'ALL';
        let myUsername = localStorage.getItem('sinless_username') || '@SinlessGaming';
        let myEmail = localStorage.getItem('sinless_email') || 'sinlessgaming@gmail.com';

        let fypPosts = JSON.parse(localStorage.getItem('sinless_posts')) || [
            { user: 'SinlessGaming', verified: true, game: 'FOOTBALL', caption: 'Absolute masterclass in tonight’s fixture! #PremierLeague #Arsenal' },
            { user: 'Sinless101', verified: true, game: 'FC MOBILE', caption: 'Official admin update: Welcome to Sinless GG! #SinlessSuperLeague' },
            { user: 'DonPrime', verified: true, game: 'EA SPORTS FC', caption: 'Match highlight / Rating update #EAFC25' }
        ];

        function saveAppData() {
            localStorage.setItem('sinless_posts', JSON.stringify(fypPosts));
            localStorage.setItem('sinless_username', myUsername);
            localStorage.setItem('sinless_email', myEmail);
        }

        function initApp() {
            document.getElementById('headerUserTag').innerText = myUsername;
            document.getElementById('setupUsernameInput').value = myUsername;
            document.getElementById('setupEmailInput').value = myEmail;
            renderFypFeed();
        }

        function openAccountModal() { document.getElementById('accountModal').classList.remove('hidden'); }
        function closeAccountModal() { document.getElementById('accountModal').classList.add('hidden'); }

        function saveUserAccount() {
            let uInput = document.getElementById('setupUsernameInput').value.trim();
            let eInput = document.getElementById('setupEmailInput').value.trim();
            if(!uInput || !eInput) {
                alert('Please enter both your email and gamer tag.');
                return;
            }
            myUsername = uInput.startsWith('@') ? uInput : '@' + uInput;
            myEmail = eInput;
            saveAppData();
            document.getElementById('headerUserTag').innerText = myUsername;
            closeAccountModal();
            alert(`🎉 Account saved successfully!\nGamer Tag: ${myUsername}`);
        }

        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.add('hidden'));
            ['fyp', 'trending', 'market'].forEach(v => {
                let navBtn = document.getElementById('nav-' + v);
                if(navBtn) {
                    navBtn.classList.remove('bg-magenta', 'text-white', 'font-extrabold', 'shadow-lg');
                    navBtn.classList.add('text-gray-400', 'font-bold');
                }
            });
            let activeSection = document.getElementById('view-' + viewName);
            let activeNav = document.getElementById('nav-' + viewName);
            if(activeSection) activeSection.classList.remove('hidden');
            if(activeNav) {
                activeNav.classList.remove('text-gray-400', 'font-bold');
                activeNav.classList.add('bg-magenta', 'text-white', 'font-extrabold', 'shadow-lg');
            }
        }

        function filterByCategory(cat, btn) {
            activeCategoryFilter = cat;
            document.querySelectorAll('#categoryFilterBar .cat-btn').forEach(b => {
                b.className = "cat-btn px-3 py-1.5 rounded-xl text-[10px] font-bold bg-gg-900 text-gray-300 border border-cyan-500/25 whitespace-nowrap transition";
            });
            if(btn) btn.className = "cat-btn px-3 py-1.5 rounded-xl text-[10px] font-extrabold bg-cyan-400 text-slate-950 whitespace-nowrap shadow transition";
            renderFypFeed();
        }

        function renderFypFeed() {
            let container = document.getElementById('fypFeedContainer');
            if(!container) return;
            container.innerHTML = '';
            let filtered = fypPosts.filter(p => activeCategoryFilter === 'ALL' || p.game === activeCategoryFilter);
            filtered.forEach(post => {
                container.innerHTML += `
                    <div class="glass-panel rounded-2xl p-3 space-y-2 shadow-xl">
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-xs text-white">@${post.user} <span class="verified-badge"><i class="fa-solid fa-circle-check"></i></span></span>
                            <span class="text-[9px] text-cyan-400 font-bold">${post.game}</span>
                        </div>
                        <p class="text-xs text-gray-200">${post.caption}</p>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
