# SINLESS GG worker settings (GitHub sends worker.js to Cloudflare by itself)
name = "sinlessggpush"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true
keep_vars = true

[ai]
binding = "AI"

[triggers]
# 0 8 + 0 18 share one line (the worker checks the hour); 4-59/5 = ⚽ 11 Wonders league
crons = ["*/5 * * * *", "2-59/5 * * * *", "0 8,18 * * *", "4-59/5 * * * *"]
